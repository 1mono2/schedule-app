    domain_driven_design_guidelines:
      description: "When implementing backend processing using Next.js API Router, please develop following Domain Driven Design (DDD)"
      details_location: "docs/guidelines/domain_driven_design_guidelines.yaml"
    testing_guidelines:
      description: "Write tests using Vitest"
      details_location: "docs/guidelines/testing_guidelines.yaml"
    test_driven_development_guidelines:
      description: "Test Driven Development (TDD) is a software development approach where you first create test cases, verify they fail, implement minimal code to pass the tests, and then continuously refactor while implementing functionality."
      details_location: "docs/guidelines/test_driven_development_guidelines.yaml"
