domain_driven_design:
  overview: >
    ドメイン駆動設計 (DDD: Domain Driven Design) は、ソフトウェア開発において複雑なビジネス領域（ドメイン）の知識を中心にシステム設計を行うアプローチです。ドメインの深い理解とその知識の反映を重視し、システム全体を柔軟かつ保守しやすい形に構築することを目的としています。
    
  core_concepts:
    domain: >
      システムが解決すべきビジネスの問題領域全体を指し、ビジネスルールや知識が集約される部分です。
    ubiquitous_language: >
      開発者とドメインエキスパートが共通して使用する言葉や用語。コードやドキュメントにこの共通言語が反映されることで、正確なコミュニケーションと理解が促進されます。
    bounded_context: >
      システムを分割するための明確な境界線。各コンテキスト内で独自のモデルや言語が定義され、異なるコンテキスト間では変換や連携が必要となります.

  building_blocks:
    entities:
      description: >
        識別可能なオブジェクトで、固有のIDを持ち、ライフサイクル全体にわたって同一性が保証されるものです。
    value_objects:
      description: >
        識別子を持たず、属性の集合として同一性が決まるオブジェクト。通常は不変（immutable）として設計されます。
    aggregates:
      description: >
        関連するエンティティや値オブジェクトの集合体。1つのルートエンティティ（aggregate root）を介して外部からの操作が行われ、一貫性の境界となります。
    repositories:
      description: >
        エンティティや集約を永続化し、取得するためのインターフェース。ドメインロジックとインフラストラクチャの橋渡しを担います。
    domain_services:
      description: >
        複数のエンティティや値オブジェクトにまたがるビジネスロジックを提供するサービス。状態を持たず、特定の操作や計算を行います。
    factories:
      description: >
        複雑なオブジェクトや集約の生成ロジックを隠蔽するための仕組み。適切な初期化や依存関係の管理を行います.

  benefits:
    - 複雑なビジネスドメインの理解が深まり、適切なモデル化が可能になる
    - ドメインエキスパートと開発者間のコミュニケーションが円滑になり、共通言語が浸透する
    - 柔軟で保守性の高いシステム構築が促進され、将来的な拡張や変更に対応しやすい