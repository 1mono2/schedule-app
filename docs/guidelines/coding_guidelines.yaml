# コーディングガイドライン: 一貫性とメンテナンス性を重視した命名規則

基本方針:
  - Googleの命名規則に基づき、nocallプロジェクト全体の一貫性を維持し、メンテナンスを容易にする

TypeScriptの命名規則:
  - 基本方針: 'Googleの命名規則に従い、コードの読みやすさと一貫性を維持'
  - 'クラス名、インターフェース名':
      規則: 'PascalCase'
      例: 'CustomerService, UserRepository'
  - '変数名、関数名':
      規則: 'camelCase'
      例: 'getCustomerDetails(), userData'
  - 定数:
      規則: 'UPPER_CASE'
      例: 'MAX_RETRY_COUNT, API_ENDPOINT'
  - ファイル名:
      規則: 'camelCase'
      例: 'customerService.ts, orderRepository.ts'

データベースの命名規則:
  - 基本方針: 'データベースのフィールド名とテーブル名にはsnake_caseを使用'
  - テーブル名: '複数形 (例: clients, end_users)'
  - フィールド名: 'シンプルで分かりやすい名前 (例: phone_number, created_by, updated_by)'

URIの命名規則:
  - 基本方針: 'URIにはkebab-caseを使用'
  - 例: '/user-groups, /end-users'

良いコードの条件:
  - 非機能要件が考慮されている:
      - 'セキュリティ、ユーザビリティ、保守性、可読性、拡張性、パフォーマンス、テスト性、例外処理などが重要'
      - '要件定義書に記載されないことが多いが、サービス運営に不可欠'
      - '高いユーザー体験と安定したサービス提供を支える'
      - '外部業者への発注では考慮されにくいため、開発者側の配慮が必要'

  - プログラミングの原理原則が守られている:
      - 'SOLID原則、UNIX思想、DRY、KISS、YAGNI、OAOO原則などを順守'
      - '可読性や保守性が高い、シンプルで美しいコードを目指す'
      - 'コードの理解にかかる時間を短縮し、開発の効率化や不具合の防止を促進'

  - リポジトリ内の無駄を排除する:
      - 'デッドコードや.DS_Storeなどの不要なファイルは除去'
      - 'コメントアウトされたコードも不要なら削除'
      - '綺麗なリポジトリを保つことで、作業効率とアウトプットの質を向上'

  - CI/CDパイプラインが整備されている:
      - '開発初期フェーズからのCI/CDパイプラインの構築'
      - 'Linter、Formatter、単体テスト、自動デプロイを整備し、効率化を図る'
      - '単純作業を自動化することで、手作業ミスを防止し開発速度を向上'

  - テストコードの存在:
      - 'テストコードがあることで、保守性の向上と品質の担保を実現'
      - 'TDDによるテストを中心にした開発手法を意識する'
